[project]
name = "image-tagger"
version = "1.0.0"
description = "Annotate images with labels"
readme = "README.md"
requires-python = ">=3.12"
# 直接相依一律用 == 釘死。放寬版本時, 套件自帶的相依範圍會跟 lock 裡的既有版本
# 互相拉扯, uv 每次重解都可能給出不同組合 (ultralytics 尤其常改 torch 的相依範圍),
# 出問題時難以重現。升級請整組一起評估, 改完務必跑過 YOLO 與 SAM3 推論再提交。
dependencies = [
    # CVE-2025-3000 (Low)：torch <=2.12.1 有安全問題，故升到 2.13 並搭配 CUDA 13 以上。
    # torchvision 0.28.0 硬性要求 torch==2.13.0，兩者必須同步升級。
    "torch==2.13.0",
    "torchvision==0.28.0",
    "opencv-python==5.0.0.93",
    "PyQt6==6.11.0",
    "dicttoxml==1.7.16",
    "ultralytics==8.4.90",
    # SAM3 到執行期才 import 的相依: clip 給 text encoder, timm 給 ViTDet backbone。
    # 兩者缺少時 ultralytics 會自行 AutoUpdate 安裝, 但 uv sync 會把不在 lock 內的
    # 套件清掉, 於是每次 sync 後第一次跑 SAM3 都要重裝, 故在此顯性宣告。
    # clip 是 ultralytics 的 fork, PyPI 上沒有, 來源見下方 tool.uv.sources。
    "clip==1.0",
    "timm==1.0.28",
    "ruamel.yaml==0.19.1",
    "python-dotenv==1.2.2",
    "pydantic==2.13.4",
    "orjson==3.11.9",
    # 刪除圖片與標籤時走資源回收筒而非 unlink，誤刪可還原（純 Python，無 C 擴充）
    "send2trash==2.1.0",
]

# torch / torchvision 從 PyTorch 官方 CUDA 13.0 (cu130) index 安裝，
# explicit = true 代表這個 index 只用在下面 tool.uv.sources 有指定的套件，
# 其餘套件仍走 PyPI，避免整份相依都被拉去 pytorch index。
[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]
# clip 只發佈在 git 上, 且版本號永遠是 1.0 不會遞增, 所以 "clip==1.0" 其實鎖不住
# 任何東西, 真正釘死的是這裡的 rev。要更新請直接改這串 commit。
clip = { git = "https://github.com/ultralytics/CLIP.git", rev = "488e81a6711eea7346872b46ea928b367da8889d" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# 開發工具 (不進執行環境)。版本同樣用 == 釘死: ruff 每個小版都可能新增或改寫
# 預設規則, 不釘住的話換台機器 lint 就跳出不同結果。
[dependency-groups]
dev = ["ruff==0.16.4"]

# CVE-2026-59890 (Moderate)：setuptools <83.0.0 有安全問題。
# 本專案不直接 import setuptools（由 torch 間接帶入），故用 constraint 拉下限，
# 不把它宣告成直接相依。
[tool.uv]
constraint-dependencies = ["setuptools>=83.0.0"]

# ruff: 只做 lint, 不套用 formatter (整份重排會蓋掉現有排版與 comment 對齊)
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# ruff 0.16 的預設規則集已含 UP / SIM / RUF 等, 這裡只關掉與本專案慣例相衝的:
ignore = [
    # 開發規範要求每個 try 都補上 except + log.error(), 廣泛捕捉是刻意的選擇
    "BLE001",
    # 本機標註工具, 時間只寫進 log 與檔名給人看, 不需要 tz-aware datetime
    "DTZ005",
]
